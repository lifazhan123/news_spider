# 工作流名称，在Actions页面会显示
name: daily_news_spider

# 触发条件
on:
  schedule:
    # 定时触发：这里是UTC时间，每天0点10分（北京时间早上8点10分）运行
    - cron: '10 0 * * *'
  # 允许手动触发，方便测试
  workflow_dispatch:

# 定义要执行的任务
jobs:
  build:
    runs-on: ubuntu-latest  # 使用免费Ubuntu环境

    steps:
      # 1. 把你的代码从仓库中检出到虚拟环境
      - uses: actions/checkout@v4

      # 2. 设置Python环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 3. 安装依赖项（如果requirements.txt存在）
      # 3. 安装依赖项
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install scrapy

      # 4. 运行爬虫
      - name: Run the news spider
        run: |
          # 注意！如果爬虫名不是 cctv，你需要在这里修改
          scrapy crawl cctv

      # 5. (可选) 将抓取结果提交回仓库
      - name: Commit and push results
        run: |
          git config user.name "lifazhan123"
          git config user.email "13856754932@163.com"
          git add .
          git commit -m "Update news data" || echo "No changes to commit"
          git push
